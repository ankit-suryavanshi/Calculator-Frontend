<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <div class="calculator">
            <h1>calculator</h1>
            <input type="text" placeholder="0">
             <div class="buttons">
                <button>AC</button>
                <button>C</button>
                <button>DEL</button>
                <button>=</button>
                <button class="ON">ON</button>
            </div>
            <div class="buttons">
                       <button>7</button>
                       <button>8</button>
                       <button>9</button>
                       <button>%</button>
                       <button class="star">*</button>
            </div>
           
            <div class="buttons">
                       <button>4</button>
                       <button>5</button>
                       <button>6</button>
                       <button>()</button>
                       <button class="devide">/</button>
            </div>
            <div class="buttons">
                       <button>1</button>
                       <button>2</button>
                       <button>3</button>
                       <button>Ans</button>
                       <button class="minus">-</button>
            </div>
            <div class="buttons">
                       <button>0</button>
                     <button>00</button>
                       <button>X</button>
                       <button>.</button>
                       <button class="plus">+</button>
            </div>
        </div>

</body>
</html>
